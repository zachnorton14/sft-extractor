name: Build Talkie encoder image

# Build encoder/Dockerfile and publish it to ghcr, as linux/amd64 (what vast.ai runs).
on:
  push:
    branches: [main]
    paths: ["encoder/Dockerfile", ".github/workflows/build-image.yml"]
  workflow_dispatch: {}   # also runnable manually from the Actions tab

permissions:
  contents: read
  packages: write         # lets the built-in GITHUB_TOKEN push to ghcr

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: encoder/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/talkie-encoder:latest
